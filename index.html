<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Praga">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Praga Timing</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314161A'/%3E%3Cpath d='M16 6a10 10 0 1 0 10 10' fill='none' stroke='%23ED1C24' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23F0B429'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="trackName">Načítám</h1>
      <div class="sub" id="trackSub">…</div>
    </div>
    <button class="ghost" id="keyToggle">klíč</button>
  </header>

  <div class="pad hide" id="keyPanel" style="padding-top:14px;padding-bottom:14px;background:var(--surface)">
    <label><span>Base64 klíč z odkazu na modul</span>
      <input id="keyInput" style="font-family:var(--mono);font-size:11px">
    </label>
    <p class="hint">Dekóduje se na <code>clientKey:guid</code>. Vezmi ho z parametru
      <code>?key=</code> jakéhokoli SMS-Timing modulu a máš tím i jinou dráhu.</p>
    <button class="go quiet" id="keyApply">Použít</button>
  </div>

  <div class="pad hide" id="bootErr" style="padding-top:16px"></div>

  <nav id="tabs" class="hide">
    <button data-tab="best" aria-selected="true">Nejlepší časy</button>
    <button data-tab="driver" aria-selected="false">Jezdec</button>
    <button data-tab="live" aria-selected="false">Živě</button>
  </nav>

  <div class="scroll hide" id="groups"></div>

  <!-- best times -->
  <section id="panel-best" class="hide">
    <div class="scroll" id="presets"></div>
    <div class="pad">
      <div class="row">
        <label><span>Od</span><input type="date" id="bFrom"></label>
        <label><span>Do</span><input type="date" id="bTo"></label>
        <label class="narrow"><span>Počet</span><input type="number" id="bMax" value="100" min="1"></label>
      </div>
      <button class="go" id="bGo">Načíst</button>
      <div class="note bad hide" id="bErr"></div>
    </div>
    <div class="list" id="bList"></div>
  </section>

  <!-- driver -->
  <section id="panel-driver" class="hide">
    <div class="pad" style="padding-top:12px">
      <label><span>Jméno jezdce (stačí část)</span>
        <input id="dName" placeholder="část přezdívky" autocomplete="off"></label>
      <div class="row">
        <label><span>Od</span><input type="date" id="dFrom"></label>
        <label><span>Do</span><input type="date" id="dTo"></label>
      </div>
      <div class="row" id="dSize"></div>
      <p class="hint" id="dHint"></p>
      <button class="go" id="dGo">Projet</button>
      <div class="note bad hide" id="dErr"></div>
    </div>
    <div id="dTrend"></div>
    <div class="list" id="dList"></div>
  </section>

  <!-- live -->
  <section id="panel-live" class="hide">
    <div class="pad" style="padding-top:12px">
      <button class="go" id="lGo">Připojit</button>
      <div class="note hide" id="lNote"></div>
      <button class="ghost hide" id="lRaw" style="align-self:flex-start">Ukázat surová data</button>
      <pre class="hide" id="lDump"></pre>
    </div>
    <div class="list" id="lList"></div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
